name: Sync Python lab and publish Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-python-lab.py'
      - 'scripts/python-lab-files.json'
      - '.github/workflows/sync-python-lab.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: python-lab-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify published files
        run: python scripts/sync-python-lab.py
      - name: Save synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python-lab
          if ! git diff --staged --quiet; then
            git commit -m "Sync Python lab from Sites"
            git push
          fi
      - name: Prepare complete portfolio
        run: |
          mkdir -p _pages
          git archive HEAD | tar -x -C _pages
          rm -rf _pages/.github _pages/scripts
          touch _pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - uses: actions/deploy-pages@v4
        id: deployment
