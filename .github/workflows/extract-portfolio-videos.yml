name: Extract portfolio videos

on:
  push:
    paths:
      - ".github/workflows/extract-portfolio-videos.yml"
      - "alexey_portfolio_github_ready.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract two demo videos from the portfolio archive
        run: |
          unzip -p alexey_portfolio_github_ready.zip alexey_portfolio_github_ready/videos/01_amber_admin_demo.mp4 > Amber_Clinic_Admin_Demo.mp4
          unzip -p alexey_portfolio_github_ready.zip alexey_portfolio_github_ready/videos/02_chess_beta_demo.mp4 > Chess_Trainer_Beta_Demo.mp4
          test -s Amber_Clinic_Admin_Demo.mp4
          test -s Chess_Trainer_Beta_Demo.mp4
          ls -lh Amber_Clinic_Admin_Demo.mp4 Chess_Trainer_Beta_Demo.mp4
      - name: Commit extracted media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Amber_Clinic_Admin_Demo.mp4 Chess_Trainer_Beta_Demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add two playable portfolio demos"
            git push origin HEAD:main
          fi
